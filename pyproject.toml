[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blackout"
version = "0.1.0"
description = "Jeu d'horreur en vue subjective, avec un rendu raycasting ecrit en Python."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pygame-ce>=2.5,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
blackout = "blackout.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/blackout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
